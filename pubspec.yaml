name: list_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  csv: ^8.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  sqlite3: ^3.5.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/list_tracker.svg
    - assets/icons/list_tracker.png


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/list_tracker.png"
  min_sdk_android: 21
